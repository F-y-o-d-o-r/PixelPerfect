<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Perfect</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.12);
      --code-bg: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --text: #1c1c1e;
        --text-muted: #6e6e73;
        --border: rgba(0, 0, 0, 0.1);
        --code-bg: rgba(0, 0, 0, 0.05);
        --accent: #0284c7;
      }
    }
    body {
      margin: 0;
      padding: 14px 16px;
      width: 290px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.45;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
    }
    .desc {
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      background: var(--code-bg);
      padding: 1px 4px;
      border-radius: 4px;
      color: var(--text);
    }
    .tip {
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon-32-disabled.png" alt="Pixel Perfect" class="icon">
    <div class="title">Недоступно на этой странице</div>
  </div>
  <p class="desc">
    Браузер блокирует расширения на системных страницах (<code>chrome://</code>, Web Store). Откройте любой веб-сайт или <code>localhost</code> для проверки вёрстки.
  </p>
  <p class="tip">
    💡 На стандартных сайтах плавающее окно открывается в 1 клик по значку.
  </p>
</body>
</html>
