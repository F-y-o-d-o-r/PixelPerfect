<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="16" height="16">
  <defs>
    <clipPath id="sqClip16"><rect width="512" height="512" rx="114" /></clipPath>
    <clipPath id="pShapeClip16">
      <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill-rule="evenodd" />
    </clipPath>
    <linearGradient id="gradTop16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.88" />
    </linearGradient>
  </defs>
  <g clip-path="url(#sqClip16)">
    <rect width="512" height="512" fill="#0E1015" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(256, 280)">
      <!-- Base Layer: White P -->
      <g transform="scale(1.15, 0.58) rotate(45)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="#FFFFFF" opacity="0.92" />
      </g>

      <!-- Alignment Rays -->
      <line x1="0" y1="20" x2="0" y2="-75" stroke="#38BDF8" stroke-width="5" stroke-dasharray="6 6" />
      <line x1="-90" y1="25" x2="-90" y2="-70" stroke="#38BDF8" stroke-width="4" stroke-dasharray="5 5" />
      <line x1="90" y1="25" x2="90" y2="-70" stroke="#38BDF8" stroke-width="4" stroke-dasharray="5 5" />

      <!-- Top Layer: Electric Blue P offset vertically by -95px -->
      <g transform="translate(0, -95)">
        <g transform="scale(1.15, 0.58) rotate(45)">
          <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="url(#gradTop16)" stroke="#60A5FA" stroke-width="6" />
          
          <!-- Exact 45x45 px Uniform Square Grid clipped inside the P -->
          <g clip-path="url(#pShapeClip16)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5">
            <!-- Vertical Lines (step = 45px everywhere: -85, -40, 5, 50, 95) -->
            <line x1="-85" y1="-140" x2="-85" y2="140" />
            <line x1="-40" y1="-140" x2="-40" y2="140" />
            <line x1="5" y1="-140" x2="5" y2="140" />
            <line x1="50" y1="-140" x2="50" y2="140" />
            <line x1="95" y1="-140" x2="95" y2="140" />

            <!-- Horizontal Lines (step = 45px everywhere: -95, -50, -5, 40, 85, 130) -->
            <line x1="-120" y1="-95" x2="120" y2="-95" />
            <line x1="-120" y1="-50" x2="120" y2="-50" />
            <line x1="-120" y1="-5" x2="120" y2="-5" />
            <line x1="-120" y1="40" x2="120" y2="40" />
            <line x1="-120" y1="85" x2="120" y2="85" />
            <line x1="-120" y1="130" x2="120" y2="130" />
          </g>

          <!-- Seamless Crosshair continuing the grid lines through the hole -->
          <line x1="-40" y1="-50" x2="50" y2="-50" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" />
          <line x1="5" y1="-85" x2="5" y2="-15" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" />
          <circle cx="5" cy="-50" r="16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.9" />
          <circle cx="5" cy="-50" r="5" fill="#FFFFFF" />
        </g>
      </g>
    </g>
  </g>
</svg>