<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="1" />
    </radialGradient>
    <clipPath id="ogSquircle"><rect x="100" y="115" width="400" height="400" rx="90" /></clipPath>
    <clipPath id="ogPClip">
      <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill-rule="evenodd" />
    </clipPath>
    <linearGradient id="ogTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Subtle background grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Left: The 3.4-B App Icon (400x400) -->
  <g clip-path="url(#ogSquircle)">
    <rect x="100" y="115" width="400" height="400" fill="#0E1015" />
    <rect x="101.5" y="116.5" width="397" height="397" rx="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5" />
    
    <g transform="translate(300, 335) scale(0.78)">
      <!-- Base Layer: White P -->
      <g transform="scale(1.15, 0.58) rotate(45)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="#FFFFFF" opacity="0.92" />
      </g>

      <!-- Alignment Rays -->
      <line x1="0" y1="20" x2="0" y2="-75" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6 6" />
      <line x1="-90" y1="25" x2="-90" y2="-70" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 5" />
      <line x1="90" y1="25" x2="90" y2="-70" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 5" />

      <!-- Top Layer: Electric Blue P offset vertically by -95px -->
      <g transform="translate(0, -95)">
        <g transform="scale(1.15, 0.58) rotate(45)">
          <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="url(#ogTopGrad)" stroke="#60A5FA" stroke-width="4" />
          
          <g clip-path="url(#ogPClip)">
            <line x1="-65" y1="-140" x2="-65" y2="140" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="20" y1="-140" x2="20" y2="40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="60" y1="-140" x2="60" y2="40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="-100" y1="-100" x2="100" y2="-100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="-100" y1="-50" x2="100" y2="-50" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="-100" y1="0" x2="100" y2="0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
            <line x1="-100" y1="60" x2="100" y2="60" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
          </g>

          <circle cx="5" cy="-50" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.85" />
          <line x1="-18" y1="-50" x2="28" y2="-50" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9" />
          <line x1="5" y1="-73" x2="5" y2="-27" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9" />
          <circle cx="5" cy="-50" r="5.5" fill="#FFFFFF" />
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Title, Subtitle, Badges -->
  <g transform="translate(560, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35" />
    <text x="110" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CHROME EXTENSION</text>

    <!-- App Title -->
    <text x="0" y="90" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">Pixel Perfect</text>
    <text x="325" y="90" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5"> by ITITI</text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="22" font-weight="500">Visual QA &amp; Design Overlay for Web Teams</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: No Ads -->
      <g>
        <rect x="0" y="0" width="95" height="36" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="47" y="23" fill="#34D399" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ No ads</text>
      </g>
      <!-- Pill 2: Free Dark Mode -->
      <g transform="translate(107, 0)">
        <rect x="0" y="0" width="150" height="36" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="75" y="23" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌙 Free Dark Mode</text>
      </g>
      <!-- Pill 3: Smart Diff -->
      <g transform="translate(269, 0)">
        <rect x="0" y="0" width="115" height="36" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="57" y="23" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Smart Diff</text>
      </g>
      <!-- Pill 4: Cmd+V -->
      <g transform="translate(396, 0)">
        <rect x="0" y="0" width="110" height="36" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="55" y="23" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📋 Cmd + V</text>
      </g>
    </g>

    <!-- Footer info -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="500">Official Publisher: ititi.dev • Manifest V3 Side Panel API</text>
    </g>
  </g>
</svg>