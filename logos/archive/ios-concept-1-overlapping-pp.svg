<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS 18 Dark Mode Squircle Base -->
    <linearGradient id="iosDarkBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>

    <!-- Clip path for Apple continuous squircle -->
    <clipPath id="squircleClip1">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <!-- iOS Squircle Canvas -->
  <g clip-path="url(#squircleClip1)">
    <rect width="512" height="512" fill="url(#iosDarkBg1)" />
    <!-- Ultra subtle iOS inner ring border -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <!-- Two Overlapping Flat "P"s (Pixel & Perfect) -->
    <!-- Back P: Semi-transparent Blue (Design Mockup layer) -->
    <g transform="translate(112, 116)" opacity="0.45">
      <path d="M 0 0 L 76 0 C 122 0 148 24 148 68 C 148 112 122 136 76 136 L 46 136 L 46 256 L 0 256 Z M 46 42 L 72 42 C 94 42 102 52 102 68 C 102 84 94 94 72 94 L 46 94 Z" 
            fill="#3B82F6" />
    </g>

    <!-- Front P: Solid Pure White (Coded DOM layer, offset by +40px) -->
    <g transform="translate(152, 140)">
      <path d="M 0 0 L 76 0 C 122 0 148 24 148 68 C 148 112 122 136 76 136 L 46 136 L 46 256 L 0 256 Z M 46 42 L 72 42 C 94 42 102 52 102 68 C 102 84 94 94 72 94 L 46 94 Z" 
            fill="#FFFFFF" />
      
      <!-- Accent: Single Cyan Matching Pixel inside the loop of front P -->
      <rect x="54" y="50" width="36" height="36" rx="8" fill="#38BDF8" />
    </g>
  </g>
</svg>
