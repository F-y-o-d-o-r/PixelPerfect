<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS 18 Dark Squircle Clip -->
    <clipPath id="squircleExact">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleExact)">
    <!-- Dark Matte Canvas -->
    <rect width="512" height="512" fill="#121316" />
    <!-- Ultra subtle border -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <!-- Group perfectly centered at (256, 256) -->
    <g transform="translate(138, 116)">
      <!-- 1. ВНЕШНЯЯ БЕЛАЯ P (Контейнер) -->
      <path d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z M 68 62 L 126 62 C 158 62 168 76 168 98 C 168 120 158 134 126 134 L 68 134 Z" 
            fill="#FFFFFF" />

      <!-- 2. ВНУТРЕННЯЯ СИНЯЯ P (Такая же, как белая, но уменьшена на 12% и отцентрована внутри) -->
      <g transform="translate(14.16, 16.8) scale(0.88)">
        <path d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z M 68 62 L 126 62 C 158 62 168 76 168 98 C 168 120 158 134 126 134 L 68 134 Z" 
              fill="#3B82F6" />
      </g>
    </g>
  </g>
</svg>
