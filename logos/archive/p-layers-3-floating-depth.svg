<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="sq3"><rect width="512" height="512" rx="114" /></clipPath>
    <linearGradient id="gradTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.82" />
    </linearGradient>
  </defs>
  <g clip-path="url(#sq3)">
    <rect width="512" height="512" fill="#0E1015" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(256, 256)">
      <!-- Base Layer: Solid White P (Lower/Back) -->
      <g transform="translate(-25, 25)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="#FFFFFF" opacity="0.9" />
      </g>

      <!-- Alignment diagonal connectors connecting matching vertices -->
      <line x1="-115" y1="-90" x2="-65" y2="-140" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6 6" />
      <line x1="70" y1="-25" x2="120" y2="-75" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6 6" />
      <line x1="-65" y1="140" x2="-15" y2="90" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6 6" />

      <!-- Top Layer: Electric Blue P (Upper/Front) -->
      <g transform="translate(25, -25)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="url(#gradTop3)" stroke="#93C5FD" stroke-width="4.5" />
        
        <!-- Precision crosshair / target pinpoint -->
        <circle cx="5" cy="-50" r="18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4" />
        <line x1="-20" y1="-50" x2="30" y2="-50" stroke="#FFFFFF" stroke-width="3" />
        <line x1="5" y1="-75" x2="5" y2="-25" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="5" cy="-50" r="6" fill="#FFFFFF" />

        <!-- Technical Corner Bracket at Origin -->
        <path d="M -80,-80 L -80,-105 L -55,-105" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>
