<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS 18 Matte Black Canvas -->
    <clipPath id="squircleClip2">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip2)">
    <rect width="512" height="512" fill="#121214" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <!-- Pure Flat Geometric Minimalist PP Monogram -->
    <!-- First 'P' (Left, Electric Blue) -->
    <g transform="translate(116, 136)">
      <!-- Stem -->
      <rect x="0" y="0" width="38" height="240" rx="12" fill="#3B82F6" />
      <!-- Loop -->
      <path d="M 38 0 L 98 0 C 138 0 156 18 156 56 C 156 94 138 112 98 112 L 38 112 Z M 38 36 L 94 36 C 114 36 120 44 120 56 C 120 68 114 76 94 76 L 38 76 Z" 
            fill="#3B82F6" />
    </g>

    <!-- Second 'P' (Right, Pure Crisp White) -->
    <g transform="translate(240, 136)">
      <!-- Stem -->
      <rect x="0" y="0" width="38" height="240" rx="12" fill="#FFFFFF" />
      <!-- Loop -->
      <path d="M 38 0 L 98 0 C 138 0 156 18 156 56 C 156 94 138 112 98 112 L 38 112 Z M 38 36 L 94 36 C 114 36 120 44 120 56 C 120 68 114 76 94 76 L 38 76 Z" 
            fill="#FFFFFF" />
      <!-- Micro-accent: Cyan target square in the counter -->
      <rect x="56" y="44" width="24" height="24" rx="6" fill="#38BDF8" />
    </g>
  </g>
</svg>
