<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleNew4">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleNew4)">
    <rect width="512" height="512" fill="#121316" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <!-- Pure Flat Swiss Minimalist Glyph -->
    <g transform="translate(148, 126)">
      <!-- Left Stem: Clean White Bar -->
      <rect x="0" y="0" width="54" height="260" rx="14" fill="#FFFFFF" />

      <!-- Center Loop: Circular Aperture in Vibrant Electric Blue -->
      <circle cx="140" cy="80" r="80" fill="#3B82F6" />

      <!-- Inner Aperture Cutout with Crosshairs -->
      <circle cx="140" cy="80" r="42" fill="#121316" />

      <!-- High Precision Crosshair Lines (+ symbol) -->
      <line x1="140" y1="20" x2="140" y2="140" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="80" y1="80" x2="200" y2="80" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

      <!-- Center Sub-pixel Core Target Dot -->
      <circle cx="140" cy="80" r="5" fill="#FFFFFF" />

      <!-- Alignment Guide Bracket on Bottom of Stem -->
      <path d="M -16 244 L 0 244 M 0 244 L 0 260" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
