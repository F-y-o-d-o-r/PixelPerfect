<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleExp4">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>

    <!-- Translucent Overlay Gradient -->
    <linearGradient id="overlayBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleExp4)">
    <rect width="512" height="512" fill="#121316" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(138, 116)">
      <!-- 1. ВНЕШНИЙ БЕЛЫЙ КОНТЕЙНЕР (С легкой сеткой верстки) -->
      <path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"
            d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z" />

      <!-- 2. СИНЯЯ P КАК ПОЛУПРОЗРАЧНЫЙ ОВЕРЛЕЙ (Видна структура выравнивания) -->
      <path fill="url(#overlayBlue)" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"
            d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z" />

      <!-- Микро-маркер пиксельного смещения: 4px delta tick внизу -->
      <rect x="0" y="274" width="68" height="6" fill="#FFFFFF" opacity="0.6" />

      <!-- Чистое ушко без обводок -->
      <path fill="#121316" stroke="#121316" stroke-width="4" stroke-linejoin="round"
            d="M 68 62 L 126 62 C 158 62 168 76 168 98 C 168 120 158 134 126 134 L 68 134 Z" />
    </g>
  </g>
</svg>
