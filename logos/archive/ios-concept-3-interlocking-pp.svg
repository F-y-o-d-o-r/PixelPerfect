<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS 18 Tinted Dark -->
    <clipPath id="squircleClip3">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip3)">
    <!-- Deepest Jet Black -->
    <rect width="512" height="512" fill="#0C0D10" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3" />

    <!-- Modern Linear / Raycast Style Monogram -->
    <!-- Two P's connected in a single fluid geometric ligature -->
    <g transform="translate(136, 126)">
      <!-- Left Stem P1 -->
      <rect x="0" y="0" width="44" height="260" rx="16" fill="#3B82F6" />
      
      <!-- Loop 1 (Pixel) -->
      <path d="M 44 0 L 110 0 C 150 0 174 20 174 58 C 174 96 150 116 110 116 L 44 116 Z M 44 40 L 106 40 C 122 40 130 46 130 58 C 130 70 122 76 106 76 L 44 76 Z" 
            fill="#3B82F6" />

      <!-- Right Stem P2 (offset & nested) -->
      <rect x="100" y="80" width="44" height="180" rx="16" fill="#FFFFFF" />

      <!-- Loop 2 (Perfect) -->
      <path d="M 144 80 L 180 80 C 220 80 240 100 240 138 C 240 176 220 196 180 196 L 144 196 Z M 144 120 L 176 120 C 192 120 196 126 196 138 C 196 150 192 156 176 156 L 144 156 Z" 
            fill="#FFFFFF" />

      <!-- Accent: Perfect Pixel Snap in Top Right of P2 -->
      <rect x="196" y="80" width="44" height="44" rx="12" fill="#38BDF8" stroke="#0C0D10" stroke-width="4" />
    </g>
  </g>
</svg>
