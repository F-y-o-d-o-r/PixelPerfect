<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleNew2">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleNew2)">
    <rect width="512" height="512" fill="#121316" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(136, 126)">
      <!-- 1. LEFT HALF: Pure Smooth Vector Stem & Start (White) -->
      <rect x="0" y="0" width="56" height="260" rx="14" fill="#FFFFFF" />
      <rect x="56" y="0" width="60" height="48" fill="#FFFFFF" />
      <rect x="56" y="96" width="60" height="48" fill="#FFFFFF" />

      <!-- 2. RIGHT HALF: Pixelated Stepped Raster Grid (Electric Blue) -->
      <!-- Top Step -->
      <rect x="116" y="0" width="48" height="48" rx="8" fill="#3B82F6" />
      <!-- Corner Top -->
      <rect x="164" y="24" width="48" height="48" rx="8" fill="#3B82F6" />
      <!-- Apex Right Block -->
      <rect x="188" y="48" width="48" height="48" rx="8" fill="#38BDF8" stroke="#121316" stroke-width="3" />
      <!-- Corner Bottom -->
      <rect x="164" y="72" width="48" height="48" rx="8" fill="#3B82F6" />
      <!-- Bottom Step -->
      <rect x="116" y="96" width="48" height="48" rx="8" fill="#3B82F6" />

      <!-- Micro coordinate crosshair -->
      <path d="M 248 72 L 260 72 M 254 66 L 254 78" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
