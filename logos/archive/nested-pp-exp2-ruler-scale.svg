<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleExp2">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleExp2)">
    <rect width="512" height="512" fill="#121316" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(138, 116)">
      <!-- 1. ВНЕШНИЙ БЕЛЫЙ КОНТЕЙНЕР (С измерительными насечками Pixel Perfect) -->
      <path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"
            d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z" />

      <!-- Насечки линейки на левой стороне белого контейнера (измерение пикселей) -->
      <g stroke="#121316" stroke-width="2.5" stroke-linecap="round">
        <line x1="-16" y1="40" x2="-8" y2="40" />
        <line x1="-16" y1="80" x2="-4" y2="80" stroke-width="3" />
        <line x1="-16" y1="120" x2="-8" y2="120" />
        <line x1="-16" y1="160" x2="-4" y2="160" stroke-width="3" />
        <line x1="-16" y1="200" x2="-8" y2="200" />
        <line x1="-16" y1="240" x2="-4" y2="240" stroke-width="3" />
      </g>

      <!-- 2. ВНУТРЕННЯЯ СИНЯЯ P (Идеально чистая заливка) -->
      <path fill="#3B82F6" stroke="#3B82F6" stroke-width="6" stroke-linejoin="round"
            d="M 0 0 L 132 0 C 196 0 236 36 236 98 C 236 160 196 196 132 196 L 68 196 L 68 280 L 0 280 Z" />

      <!-- Чистое ушко без лишних колец -->
      <path fill="#121316" stroke="#121316" stroke-width="4" stroke-linejoin="round"
            d="M 68 62 L 126 62 C 158 62 168 76 168 98 C 168 120 158 134 126 134 L 68 134 Z" />
    </g>
  </g>
</svg>
