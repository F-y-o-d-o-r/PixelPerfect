<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS 18 Pure Dark Canvas -->
    <clipPath id="iosSquircle">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>

    <linearGradient id="innerBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <g clip-path="url(#iosSquircle)">
    <!-- Dark Matte Obsidian Background -->
    <rect width="512" height="512" fill="#121316" />
    <!-- Subtle edge highlight -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <!-- Group Centered in Canvas -->
    <g transform="translate(142, 106)">
      <!-- OUTER CONTAINER: Bold White 'P' -->
      <path d="M 0 0 L 130 0 C 196 0 236 36 236 98 C 236 160 196 196 130 196 L 68 196 L 68 300 L 0 300 Z M 68 62 L 124 62 C 156 62 168 76 168 98 C 168 120 156 134 124 134 L 68 134 Z" 
            fill="#FFFFFF" />

      <!-- INNER NESTED 'P': Inside with uniform padding, exact geometric echo -->
      <path d="M 20 20 L 110 20 C 158 20 188 46 188 98 C 188 150 158 176 110 176 L 68 176 L 68 280 L 20 280 Z M 68 68 L 108 68 C 130 68 138 78 138 98 C 138 118 130 128 108 128 L 68 128 Z" 
            fill="#3B82F6" />

      <!-- Deep dark core hole of inner P to preserve perfect negative space -->
      <path d="M 68 68 L 108 68 C 130 68 138 78 138 98 C 138 118 130 128 108 128 L 68 128 Z" 
            fill="#121316" />
    </g>
  </g>
</svg>
