<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="iosSquircle3">
      <rect x="0" y="0" width="512" height="512" rx="114" />
    </clipPath>
  </defs>

