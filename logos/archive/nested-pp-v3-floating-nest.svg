      <path d="M 0 0 L 144 0 C 214 0 256 40 256 110 C 256 180 214 220 144 220 L 76 220 L 76 300 L 0 300 Z M 76 68 L 136 68 C 172 68 184 86 184 110 C 184 134 172 152 136 152 L 76 152 Z" 
            fill="#FFFFFF" />

