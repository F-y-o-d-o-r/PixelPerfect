<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="sq2"><rect width="512" height="512" rx="114" /></clipPath>
    <linearGradient id="gradTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <g clip-path="url(#sq2)">
    <rect width="512" height="512" fill="#0E1015" />
    <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

    <g transform="translate(230, 275)">
      <!-- Isometric transform: matrix(0.866, -0.4, 0, 0.95, 0, 0) -->
      <!-- Bottom Layer: White Coded P -->
      <g transform="matrix(0.88, -0.36, 0, 0.92, -35, 30)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="#FFFFFF" opacity="0.95" />
      </g>

      <!-- Alignment Guides between the two layers -->
      <line x1="-115" y1="-70" x2="-45" y2="-120" stroke="#38BDF8" stroke-width="3" stroke-dasharray="5 5" />
      <line x1="45" y1="-120" x2="115" y2="-170" stroke="#38BDF8" stroke-width="3" stroke-dasharray="5 5" />
      <line x1="-70" y1="140" x2="0" y2="90" stroke="#38BDF8" stroke-width="3" stroke-dasharray="5 5" />

      <!-- Top Layer: Electric Blue Design P offset in 3D (+70px x, -50px y) -->
      <g transform="matrix(0.88, -0.36, 0, 0.92, 35, -20)">
        <path d="M -90, -115 L -90, 115 A 15,15 0 0,0 -75, 130 L -55, 130 A 15,15 0 0,0 -40, 115 L -40, 30 L 15, 30 A 80,80 0 0,0 95, -50 A 80,80 0 0,0 15, -130 L -70, -130 A 20,20 0 0,0 -90, -115 Z M -40, -85 L 15, -85 A 35,35 0 0,1 50, -50 A 35,35 0 0,1 15, -15 L -40, -15 Z" fill="url(#gradTop2)" stroke="#60A5FA" stroke-width="4" />
        
        <!-- Subtle Grid on Top P -->
        <line x1="-90" y1="-30" x2="95" y2="-30" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
        <line x1="-90" y1="30" x2="-40" y2="30" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
        <line x1="0" y1="-130" x2="0" y2="30" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

        <!-- Target Point at Alignment Origin [0, 0] -->
        <circle cx="-90" cy="-115" r="7" fill="#FFFFFF" />
        <circle cx="-90" cy="-115" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      </g>
    </g>
  </g>
</svg>